<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Utc · BusVibes</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  >

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      color: white;
      background: #080808;
      overflow-x: hidden;
      position: relative;
    }

    /* =========================
       BACKGROUND
    ========================= */

    .saloon-bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      background-color: #090909;
      background-image: url("image/autoimg.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition:
    background-image 0.5s ease,
    background-position 0.4s ease;

  will-change: transform;
    }

    .saloon-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.25);
    }

    /* =========================
       TOP BAR
    ========================= */

    .top-bar {
      position: fixed;
      top: 1.5rem;
      left: 1.8rem;
      right: 1.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .top-bar-center {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .online-badge {
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      padding: 0.35rem 0.9rem;
      border-radius: 100px;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.95);
    }

    .online-dot {
      width: 9px;
      height: 9px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 10px #22c55e;
      animation: pulse-dot 2s infinite;
    }

    @keyframes pulse-dot {
      0% {
        opacity: 0.6;
        transform: scale(0.95);
      }

      50% {
        opacity: 1;
        transform: scale(1.2);
      }

      100% {
        opacity: 0.6;
        transform: scale(0.95);
      }
    }
/* =========================================================
   BUS SEAT SHAKE EFFECTS
========================================================= */
    ======================== */

.seat-selector {
  position: relative;
  z-index: 50;
}

/* Dropdown circular button */

.seat-dropdown-btn {
  width: 58px;
  height: 58px;

  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 50%;

  background: rgba(15, 15, 15, 0.58);
  color: #fff;

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);

  box-shadow:
    0 10px 30px rgba(0, 0, 0, 0.5),
    inset 0 1px 0 rgba(255, 255, 255, 0.15);

  display: flex;
  align-items: center;
  justify-content: center;

  gap: 5px;
  cursor: pointer;

  transition: all 0.2s ease;
}

.seat-dropdown-btn:hover {
  background: rgba(255, 255, 255, 0.16);
  transform: scale(1.06);
}

.seat-dropdown-btn:active {
  transform: scale(0.92);
}

.seat-dropdown-btn i:first-child {
  font-size: 1.35rem;
}

.seat-arrow {
  font-size: 0.75rem !important;
  transition: transform 0.2s ease;
}

/* Arrow rotate when menu open */

.seat-selector.open .seat-arrow {
  transform: rotate(180deg);
}


/* =========================
   SEAT MENU
========================= */

.seat-menu {
  position: absolute;

  left: 68px;
  top: 50%;
  transform: translateY(-50%) translateX(-8px);

  width: 170px;

  padding: 7px;

  background: rgba(15, 15, 15, 0.82);

  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);

  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 16px;

  box-shadow:
    0 15px 40px rgba(0, 0, 0, 0.6),
    inset 0 1px 0 rgba(255, 255, 255, 0.08);

  opacity: 0;
  visibility: hidden;
  pointer-events: none;

  transition:
    opacity 0.2s ease,
    transform 0.2s ease,
    visibility 0.2s ease;
}


/* Open menu */

.seat-selector.open .seat-menu {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;

  transform: translateY(-50%) translateX(0);
}


/* =========================
   SEAT OPTIONS
========================= */

.seat-option {
  width: 100%;

  border: none;
  border-radius: 11px;

  background: transparent;
  color: #fff;

  padding: 10px 12px;

  display: flex;
  align-items: center;
  gap: 10px;

  font-family: 'Inter', sans-serif;
  font-size: 0.8rem;
  font-weight: 500;

  cursor: pointer;

  text-align: left;

  transition: all 0.15s ease;
}

.seat-option i {
  width: 20px;

  font-size: 1rem;

  color: rgba(255, 255, 255, 0.8);
}

.seat-option:hover {
  background: rgba(255, 255, 255, 0.13);
}

.seat-option:active {
  transform: scale(0.97);
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

  .seat-dropdown-btn {
    width: 50px;
    height: 50px;
  }

  .seat-menu {
    left: 60px;
    width: 155px;
  }

}

/* =========================================================
   BUS SEAT SHAKE EFFECT
   10 SEC REST → 2 SEC SHAKE → REPEAT
========================================================= */

/* ---------------------------------------------------------
   FRONT SEAT
--------------------------------------------------------- */

body.seat-front .saloon-bg,
body.seat-front .logo-container,
body.seat-front .top-bar,
body.seat-front .left-sound-buttons {

    animation: frontBusShake 12s ease-in-out infinite;
}


/* ---------------------------------------------------------
   MID SEAT
--------------------------------------------------------- */

body.seat-mid .saloon-bg,
body.seat-mid .logo-container,
body.seat-mid .top-bar,
body.seat-mid .left-sound-buttons {

    animation: midBusShake 12s ease-in-out infinite;
}


/* ---------------------------------------------------------
   LAST SEAT
--------------------------------------------------------- */

body.seat-last .saloon-bg,
body.seat-last .logo-container,
body.seat-last .top-bar,
body.seat-last .left-sound-buttons {

    animation: lastBusShake 12s ease-in-out infinite;
}


/* =========================================================
   FRONT SEAT
   0-10 sec = REST
   10-12 sec = SHAKE
========================================================= */

@keyframes frontBusShake {

    /* 0 - 10 sec : STATIC */

    0%,
    83% {

        transform: translate3d(0, 0, 0);
    }


    /* SHAKE START */

    85% {

        transform: translate3d(-1px, 0.5px, 0);
    }

    86.5% {

        transform: translate3d(1.5px, -0.5px, 0);
    }

    88% {

        transform: translate3d(-2px, 1px, 0);
    }

    89.5% {

        transform: translate3d(1px, -1px, 0);
    }

    91% {

        transform: translate3d(-1.5px, 0.5px, 0);
    }

    92.5% {

        transform: translate3d(2px, 0, 0);
    }

    94% {

        transform: translate3d(-1px, -0.5px, 0);
    }

    95.5% {

        transform: translate3d(1px, 1px, 0);
    }

    97% {

        transform: translate3d(-0.5px, -0.5px, 0);
    }

    /* SHAKE END */

    100% {

        transform: translate3d(0, 0, 0);
    }
}


/* =========================================================
   MID SEAT
   Slightly stronger
========================================================= */

@keyframes midBusShake {

    /* REST */

    0%,
    83% {

        transform: translate3d(0, 0, 0);
    }


    /* SHAKE */

    85% {

        transform: translate3d(-3px, 1px, 0);
    }

    86.5% {

        transform: translate3d(4px, -1px, 0);
    }

    88% {

        transform: translate3d(-5px, 2px, 0);
    }

    89.5% {

        transform: translate3d(3px, -2px, 0);
    }

    91% {

        transform: translate3d(-4px, 1px, 0);
    }

    92.5% {

        transform: translate3d(5px, 0, 0);
    }

    94% {

        transform: translate3d(-3px, -1px, 0);
    }

    95.5% {

        transform: translate3d(2px, 2px, 0);
    }

    97% {

        transform: translate3d(-1px, 0, 0);
    }

    /* END */

    100% {

        transform: translate3d(0, 0, 0);
    }
}


/* =========================================================
   LAST SEAT
   Strongest movement
========================================================= */

@keyframes lastBusShake {

    /* REST */

    0%,
    83% {

        transform:
            translate3d(0, 0, 0)
            rotate(0deg);
    }


    /* SHAKE */

    85% {

        transform:
            translate3d(-5px, 2px, 0)
            rotate(-0.15deg);
    }

    86.5% {

        transform:
            translate3d(6px, -2px, 0)
            rotate(0.18deg);
    }

    88% {

        transform:
            translate3d(-7px, 3px, 0)
            rotate(-0.22deg);
    }

    89.5% {

        transform:
            translate3d(5px, -3px, 0)
            rotate(0.20deg);
    }

    91% {

        transform:
            translate3d(-6px, 2px, 0)
            rotate(-0.18deg);
    }

    92.5% {

        transform:
            translate3d(7px, -1px, 0)
            rotate(0.15deg);
    }

    94% {

        transform:
            translate3d(-5px, -2px, 0)
            rotate(-0.12deg);
    }

    95.5% {

        transform:
            translate3d(3px, 2px, 0)
            rotate(0.10deg);
    }

    97% {

        transform:
            translate3d(-2px, 0, 0)
            rotate(-0.05deg);
    }


    /* BACK TO NORMAL */

    100% {

        transform:
            translate3d(0, 0, 0)
            rotate(0deg);
    }
}

    /* =========================
       LINKS
    ========================= */

    .pill-link {
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 100px;
      padding: 0.35rem 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: white;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 500;
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .pill-link:hover {
      background: rgba(255, 255, 255, 0.15);
      color: white;
      transform: translateY(-1px);
    }

    .pill-link i {
      font-size: 1.05rem;
    }

    /* =========================
       HERO / LOGO
    ========================= */

    .logo-container {
      margin-top: 12vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 1.5rem;
      text-align: center;
    }

    .saloon-hindi-svg {
      width: 60vw;
      max-width: 460px;
      height: auto;
      filter: drop-shadow(0 6px 20px rgba(0, 0, 0, 0.6));
    }

    /* =========================
       HIDDEN YOUTUBE PLAYERS
    ========================= */

    #youtube-player,
    #horn-youtube-player,
    #bodi-gali-youtube-player {
      position: absolute;
      width: 1px;
      height: 1px;
      left: -9999px;
      top: -9999px;
      opacity: 0;
      pointer-events: none;
    }

    /* =========================
       LEFT SOUND BUTTONS
    ========================= */

    .left-sound-buttons {
      position: fixed;
      left: 1.5rem;
      top: 50%;
      transform: translateY(-50%);
      z-index: 30;

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
    }

    /* =========================
       COMMON SOUND BUTTON
    ========================= */

    .sound-btn {
      width: 58px;
      height: 58px;

      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 50%;

      background: rgba(15, 15, 15, 0.58);
      color: #ffffff;

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        background 0.15s ease,
        box-shadow 0.15s ease;

      padding: 0;
    }

    .sound-btn i {
      font-size: 1.5rem;
    }

    .sound-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      transform: scale(1.06);
    }

    .sound-btn:active {
      transform: scale(0.92);
    }

    .sound-btn.playing {
      background: rgba(255, 255, 255, 0.2);

      box-shadow:
        0 0 0 5px rgba(255, 255, 255, 0.05),
        0 0 25px rgba(255, 255, 255, 0.25);
    }

    /* =========================
       BODI GALI BUTTON
    ========================= */

    .bodi-gali-btn {
      font-size: 0.62rem !important;
      line-height: 1.05;
    }

    .bodi-gali-btn i {
      font-size: 1.35rem;
    }

    /* =========================
       FLOATING PLAYER
    ========================= */

    .player-wrapper {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 2rem);
      max-width: 680px;
      z-index: 20;
    }

    .player-glass {
      width: 100%;
      background: rgba(20, 20, 20, 0.55);
      backdrop-filter: blur(24px) saturate(190%);
      -webkit-backdrop-filter: blur(24px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 100px;
      padding: 0.6rem 0.8rem;
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    /* =========================
       ALBUM
    ========================= */

    .album-wrapper {
      position: relative;
      width: 58px;
      height: 58px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .album-art {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      object-fit: cover;
      background: #222;
      border: 2px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      animation: spin 12s linear infinite;
      animation-play-state: paused;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .play-pause-center {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 24px;
      height: 24px;
      background: rgba(0, 0, 0, 0.75);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.25);
      pointer-events: none;
    }

    .play-pause-center i {
      font-size: 12px;
    }

    /* =========================
       TRACK INFO
    ========================= */

    .track-info {
      min-width: 140px;
    }

    .track-title {
      font-size: 0.92rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #ffffff;
    }

    .track-artist {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.65);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* =========================
       PROGRESS
    ========================= */

    .progress-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 5px;
    }

    .time-label {
      font-size: 0.68rem;
      color: rgba(255, 255, 255, 0.55);
      min-width: 28px;
    }

    .progress-custom {
      height: 4px;
      flex: 1;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #ffffff;
      border-radius: 10px;
      transition: width 0.15s linear;
    }

    /* =========================
       PLAYER BUTTONS
    ========================= */

    .ctrl-btn {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: rgba(255, 255, 255, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
    }

    .ctrl-btn:active {
      transform: scale(0.92);
    }

    .play-btn {
      width: 44px;
      height: 44px;
      background: #ffffff;
      color: #080808;
      font-size: 1.35rem;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.4);
    }

    .play-btn:hover {
      background: #f0f0f0;
      color: #000000;
      transform: scale(1.05);
    }

    /* =========================
       STATUS
    ========================= */

    .player-status {
      text-align: center;
      margin-top: 8px;
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.55);
    }

    .status-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #facc15;
      margin-right: 5px;
    }

    .status-dot.playing {
      background: #4ade80;
      box-shadow: 0 0 8px #4ade80;
    }

    .footer-text {
      text-align: center;
      margin-top: 4px;
      font-size: 0.65rem;
      opacity: 0.4;
      letter-spacing: 0.05em;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .top-bar {
        position: relative;
        top: auto;
        left: auto;
        right: auto;
        padding: 1.2rem 1rem 0;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: space-between;
      }

      .top-bar-center {
        position: static;
        transform: none;
        order: -1;
        width: 100%;
        display: flex;
        justify-content: center;
        margin-bottom: 5px;
      }

      .logo-container {
        margin-top: 4vh;
      }

      .saloon-hindi-svg {
        width: 80vw;
      }

      .player-wrapper {
        bottom: 1.2rem;
        width: calc(100% - 1.2rem);
      }

      .player-glass {
        border-radius: 28px;
        padding: 8px 12px;
        flex-wrap: wrap;
      }

      .track-info {
        width: calc(100% - 70px);
        min-width: 0;
      }

      .player-controls {
        width: 100%;
        justify-content: center;
        margin-top: 4px;
      }

      .album-wrapper,
      .album-art {
        width: 52px;
        height: 52px;
      }

      .left-sound-buttons {
        left: 0.7rem;
        top: 50%;
      }

      .sound-btn {
        width: 50px;
        height: 50px;
      }

      .sound-btn i {
        font-size: 1.25rem;
      }

      .bodi-gali-btn {
        font-size: 0.55rem !important;
      }
    }
  </style>
</head>

<body>

       BACKGROUND

  <!-- =========================
       TOP BAR

  </div>

  <div id="youtube-player"></div>

  <div id="horn-youtube-player"></div>

  <div id="bodi-gali-youtube-player"></div>


  <!-- =========================
       LEFT SOUND BUTTONS
  ========================= -->

  <div class="left-sound-buttons">

    /* =========================================================
       VARIABLES
    ========================================================= */

  

  let player = null;
  let playerReady = false;

  let currentIndex = 0;
  let isPlaying = false;
  let userStarted = false;

  let progressTimer = null;


  /* =========================================================
     DOM
  ========================================================= */

  const playBtn =
    document.getElementById("playBtn");

  const playIcon =
    document.getElementById("playIcon");

  const overlayIcon =
    document.getElementById("overlayIcon");

  const albumArt =
    document.getElementById("albumArt");

  const albumWrapper =
    document.getElementById("albumWrapper");

  const trackTitle =
    document.getElementById("trackTitle");

  const trackArtist =
    document.getElementById("trackArtist");

  const currentTime =
    document.getElementById("currentTime");

  const durationTime =
    document.getElementById("durationTime");

  const progressFill =
    document.getElementById("progressFill");

  const progressContainer =
    document.getElementById("progressContainer");

  const statusText =
    document.getElementById("statusText");

  const statusDot =
    document.getElementById("statusDot");


  /* =========================================================
     TIME FORMAT
  ========================================================= */

  function formatTime(seconds) {

    if (
      !seconds ||
      isNaN(seconds) ||
      seconds < 0
    ) {
      return "0:00";
    }

    const mins =
      Math.floor(seconds / 60);

    const secs =
      Math.floor(seconds % 60);

    return (
      mins +
      ":" +
      String(secs).padStart(2, "0")
    );
  }


  /* =========================================================
     PLAY BUTTON UI
  ========================================================= */

  function updatePlayButton(playing) {

    isPlaying = playing;

    if (playing) {

      playIcon.className =
        "bi bi-pause-fill";

      overlayIcon.className =
        "bi bi-pause-fill";

      albumArt.style.animationPlayState =
        "running";

      statusDot.classList.add(
        "playing"
      );

      statusText.textContent =
        "Now playing";

    } else {

      playIcon.className =
        "bi bi-play-fill";

      overlayIcon.className =
        "bi bi-play-fill";

      albumArt.style.animationPlayState =
        "paused";

      statusDot.classList.remove(
        "playing"
      );

      statusText.textContent =
        "Paused";
    }
  }


  /* =========================================================
     UPDATE TRACK UI
  ========================================================= */

  function updateTrackUI(index) {

    const song =
      playlist[index];

    if (!song) return;

    trackTitle.textContent =
      song.title;

    trackArtist.textContent =
      song.artist;

    albumArt.src =
      song.cover;

    currentTime.textContent =
      "0:00";

    durationTime.textContent =
      "0:00";

    progressFill.style.width =
      "0%";
  }


  /* =========================================================
     LOAD TRACK
  ========================================================= */

  function loadTrack(
    index,
    autoPlay = false
  ) {

    if (
      !playerReady ||
      !player
    ) {
      return;
    }

    if (
      index < 0 ||
      index >= playlist.length
    ) {
      return;
    }

    currentIndex =
      index;

    const song =
      playlist[currentIndex];

    updateTrackUI(
      currentIndex
    );

    statusText.textContent =
      "Loading " +
      song.title +
      "...";


    if (autoPlay) {

      player.loadVideoById({
        videoId: song.id,
        startSeconds: 0
      });

    } else {

      player.cueVideoById({
        videoId: song.id,
        startSeconds: 0
      });

    }
  }


  /* =========================================================
     PLAY
  ========================================================= */

  function playMusic() {

    if (
      !playerReady ||
      !player
    ) {

      statusText.textContent =
        "YouTube player loading...";

      return;
    }

    userStarted = true;

    player.playVideo();

    statusText.textContent =
      "Starting music...";
  }


  /* =========================================================
     PAUSE
  ========================================================= */

  function pauseMusic() {

    if (
      !playerReady ||
      !player
    ) {
      return;
    }

    player.pauseVideo();
  }


  /* =========================================================
     TOGGLE
  ========================================================= */

  function togglePlay() {

    if (!playerReady) {

      statusText.textContent =
        "YouTube player loading...";

      return;
    }

    if (isPlaying) {

      pauseMusic();

    } else {

      playMusic();

    }
  }


  /* =========================================================
     NEXT
  ========================================================= */

  function nextTrack() {

    currentIndex =
      (currentIndex + 1) %
      playlist.length;

    updateTrackUI(
      currentIndex
    );

    const song =
      playlist[currentIndex];

    statusText.textContent =
      "Loading next song...";

    player.loadVideoById({
      videoId: song.id,
      startSeconds: 0
    });

    userStarted = true;
  }


  /* =========================================================
     PREVIOUS
  ========================================================= */

  function prevTrack() {

    currentIndex =
      (
        currentIndex -
        1 +
        playlist.length
      ) %
      playlist.length;

    updateTrackUI(
      currentIndex
    );

    const song =
      playlist[currentIndex];

    statusText.textContent =
      "Loading previous song...";

    player.loadVideoById({
      videoId: song.id,
      startSeconds: 0
    });

    userStarted = true;
  }


  /* =========================================================
     YOUTUBE API READY
  ========================================================= */

  window.onYouTubeIframeAPIReady =
    function () {

      console.log(
        "YouTube API Ready"
      );


      /* =====================================================
         MAIN PLAYER
      ===================================================== */

      player =
        new YT.Player(
          "youtube-player",
          {

            width: "1",
            height: "1",

            videoId:
              playlist[0].id,

            playerVars: {
              autoplay: 0,
              controls: 0,
              rel: 0,
              playsinline: 1,
              modestbranding: 1,
              iv_load_policy: 3
            },

            events: {

              onReady:
                onPlayerReady,

              onStateChange:
                onPlayerStateChange,

              onError:
                onPlayerError

            }

          }
        );


      /* =====================================================
         HORN PLAYER
      ===================================================== */

      createHornPlayer();


      /* =====================================================
         BODI GALI PLAYER
      ===================================================== */

      createBodiGaliPlayer();

    };


  /* =========================================================
     MAIN PLAYER READY
  ========================================================= */

  function onPlayerReady() {

    console.log(
      "YouTube Player Ready"
    );

    playerReady = true;

    updateTrackUI(
      currentIndex
    );

    statusText.textContent =
      "Press Play to start music";

    progressTimer =
      setInterval(
        updateProgress,
        500
      );
  }


  /* =========================================================
     MAIN PLAYER STATE
  ========================================================= */

  function onPlayerStateChange(event) {

    const state =
      event.data;

    console.log(
      "YouTube state:",
      state
    );


    if (
      state ===
      YT.PlayerState.PLAYING
    ) {

      updatePlayButton(true);

    }


    else if (
      state ===
      YT.PlayerState.PAUSED
    ) {

      updatePlayButton(false);

    }


    else if (
      state ===
      YT.PlayerState.BUFFERING
    ) {

      statusText.textContent =
        "Buffering...";

    }


    else if (
      state ===
      YT.PlayerState.ENDED
    ) {

      updatePlayButton(false);

      setTimeout(
        function () {

          nextTrack();

        },
        300
      );
    }
  }


  /* =========================================================
     YOUTUBE ERROR
  ========================================================= */

  function onPlayerError(event) {

    console.error(
      "YouTube Error:",
      event.data
    );

    statusText.textContent =
      "This track cannot play. Trying next...";

    setTimeout(
      function () {

        nextTrack();

      },
      1000
    );
  }


  /* =========================================================
     PROGRESS
  ========================================================= */

  function updateProgress() {

    if (
      !playerReady ||
      !player
    ) {
      return;
    }

    try {

      const current =
        player.getCurrentTime();

      const duration =
        player.getDuration();

      if (
        duration &&
        duration > 0
      ) {

        const percent =
          (
            current /
            duration
          ) * 100;

        progressFill.style.width =
          Math.min(
            100,
            percent
          ) + "%";

        currentTime.textContent =
          formatTime(current);

        durationTime.textContent =
          formatTime(duration);
      }

    } catch (error) {

      console.log(
        "Progress error",
        error
      );
    }
  }


  /* =========================================================
     SEEK
  ========================================================= */

  progressContainer.addEventListener(
    "click",
    function (event) {

      if (
        !playerReady ||
        !player
      ) {
        return;
      }

      const rect =
        this.getBoundingClientRect();

      const clickX =
        event.clientX -
        rect.left;

      const percentage =
        Math.max(
          0,
          Math.min(
            1,
            clickX /
            rect.width
          )
        );

      const duration =
        player.getDuration();

      if (
        duration &&
        duration > 0
      ) {

        player.seekTo(
          percentage *
          duration,
          true
        );
      }

    }
  );


  /* =========================================================
     MAIN PLAYER BUTTON EVENTS
  ========================================================= */

  playBtn.addEventListener(
    "click",
    function () {

      togglePlay();

    }
  );


  albumWrapper.addEventListener(
    "click",
    function () {

      togglePlay();

    }
  );


  document
    .getElementById("nextBtn")
    .addEventListener(
      "click",
      function () {

        if (playerReady) {

          nextTrack();

        }

      }
    );


  document
    .getElementById("prevBtn")
    .addEventListener(
      "click",
      function () {

        if (playerReady) {

          prevTrack();

        }

      }
    );


  /* =========================================================
     KEYBOARD
  ========================================================= */

  document.addEventListener(
    "keydown",
    function (event) {

      if (
        event.code ===
        "Space"
      ) {

        event.preventDefault();

        togglePlay();

      }


      else if (
        event.code ===
        "ArrowRight"
      ) {

        event.preventDefault();

        if (playerReady) {

          nextTrack();

        }

      }


      else if (
        event.code ===
        "ArrowLeft"
      ) {

        event.preventDefault();

        if (playerReady) {

          prevTrack();

        }

      }

    }
  );


  /* =========================================================
     CLEANUP
  ========================================================= */

  window.addEventListener(
    "beforeunload",
    function () {

      if (progressTimer) {

        clearInterval(
          progressTimer
        );

      }

    }
  );


  /* =========================================================
     BUS HORN
  ========================================================= */

  let hornPlayer = null;
  let hornPlayerReady = false;

  const hornBtn =
    document.getElementById(
      "hornBtn"
    );


  /* =========================================================
     CREATE HORN PLAYER
  ========================================================= */

  function createHornPlayer() {

    hornPlayer =
      new YT.Player(
        "horn-youtube-player",
        {

          width: "1",
          height: "1",

          videoId:
            "S3CfBvhzvsc",

          playerVars: {

            autoplay: 0,
            controls: 0,
            rel: 0,
            playsinline: 1,
            modestbranding: 1,
            iv_load_policy: 3

          },

          events: {

            onReady:
              onHornPlayerReady,

            onStateChange:
              onHornPlayerStateChange,

            onError:
              onHornPlayerError

          }

        }
      );
  }


  /* =========================================================
     HORN READY
  ========================================================= */

  function onHornPlayerReady() {

    console.log(
      "Horn Player Ready"
    );

    hornPlayerReady =
      true;
  }


  /* =========================================================
     HORN STATE
  ========================================================= */

  function onHornPlayerStateChange(
    event
  ) {

    if (
      event.data ===
      YT.PlayerState.PLAYING
    ) {

      hornBtn.classList.add(
        "playing"
      );

    }


    if (
      event.data ===
      YT.PlayerState.PAUSED ||
      event.data ===
      YT.PlayerState.ENDED
    ) {

      hornBtn.classList.remove(
        "playing"
      );

    }

  }


  /* =========================================================
     HORN ERROR
  ========================================================= */

  function onHornPlayerError(
    event
  ) {

    console.error(
      "Horn YouTube Error:",
      event.data
    );

    hornBtn.classList.remove(
      "playing"
    );
  }


  /* =========================================================
     HORN BUTTON
     
     BEHAVIOR:
     
     1. Horn playing
        → Horn pause

     2. Main music playing
        → Main music pause

     3. Bodi Gali playing
        → Bodi Gali pause

     4. Horn
        → Start from beginning
  ========================================================= */

  hornBtn.addEventListener(
    "click",
    function () {

      if (
        !hornPlayerReady ||
        !hornPlayer
      ) {

        return;
      }


      const state =
        hornPlayer.getPlayerState();


      /* =====================================================
         HORN ALREADY PLAYING
         → ONLY PAUSE HORN
      ===================================================== */

      if (
        state ===
        YT.PlayerState.PLAYING
      ) {

        hornPlayer.pauseVideo();

        return;
      }


      /* =====================================================
         MAIN MUSIC PLAYING
         → PAUSE MAIN MUSIC
      ===================================================== */

      if (
        playerReady &&
        player &&
        player.getPlayerState() ===
          YT.PlayerState.PLAYING
      ) {

        player.pauseVideo();

      }


      /* =====================================================
         BODI GALI PLAYING
         → PAUSE BODI GALI
      ===================================================== */

      if (
        bodiGaliPlayerReady &&
        bodiGaliPlayer &&
        bodiGaliPlayer.getPlayerState() ===
          YT.PlayerState.PLAYING
      ) {

        bodiGaliPlayer.pauseVideo();

      }


      /* =====================================================
         START HORN
      ===================================================== */

      hornPlayer.seekTo(
        0,
        true
      );

      hornPlayer.playVideo();

    }
  );


  /* =========================================================
     BODI GALI
  ========================================================= */

  let bodiGaliPlayer = null;
  let bodiGaliPlayerReady = false;

  const bodiGaliBtn =
    document.getElementById(
      "bodiGaliBtn"
    );


  /* =========================================================
     CREATE BODI GALI PLAYER
  ========================================================= */

  function createBodiGaliPlayer() {

    bodiGaliPlayer =
      new YT.Player(
        "bodi-gali-youtube-player",
        {

          width: "1",
          height: "1",

          videoId:
            "VMPeaoG2fIc",

          playerVars: {

            autoplay: 0,
            controls: 0,
            rel: 0,
            playsinline: 1,
            modestbranding: 1,
            iv_load_policy: 3

          },

          events: {

            onReady:
              onBodiGaliPlayerReady,

            onStateChange:
              onBodiGaliPlayerStateChange,

            onError:
              onBodiGaliPlayerError

          }

        }
      );
  }


  /* =========================================================
     BODI GALI READY
  ========================================================= */

  function onBodiGaliPlayerReady() {

    console.log(
      "Bodi Gali Player Ready"
    );

    bodiGaliPlayerReady =
      true;
  }


  /* =========================================================
     BODI GALI STATE
  ========================================================= */

  function onBodiGaliPlayerStateChange(
    event
  ) {

    if (
      event.data ===
      YT.PlayerState.PLAYING
    ) {

      bodiGaliBtn.classList.add(
        "playing"
      );

    }


    if (
      event.data ===
      YT.PlayerState.PAUSED ||
      event.data ===
      YT.PlayerState.ENDED
    ) {

      bodiGaliBtn.classList.remove(
        "playing"
      );

    }

  }


  /* =========================================================
     BODI GALI ERROR
  ========================================================= */

  function onBodiGaliPlayerError(
    event
  ) {

    console.error(
      "Bodi Gali YouTube Error:",
      event.data
    );

    bodiGaliBtn.classList.remove(
      "playing"
    );
  }


  /* =========================================================
     BODI GALI BUTTON
     
     BEHAVIOR:
     
     1. Bodi Gali playing
        → Bodi Gali pause

     2. Main music playing
        → Main music pause

     3. Horn playing
        → Horn pause

     4. Bodi Gali
        → Start from beginning
  ========================================================= */

  bodiGaliBtn.addEventListener(
    "click",
    function () {

      if (
        !bodiGaliPlayerReady ||
        !bodiGaliPlayer
      ) {

        return;
      }


      const state =
        bodiGaliPlayer.getPlayerState();


      /* =====================================================
         BODI GALI ALREADY PLAYING
         → ONLY PAUSE BODI GALI
      ===================================================== */

      if (
        state ===
        YT.PlayerState.PLAYING
      ) {

        bodiGaliPlayer.pauseVideo();

        return;
      }


      /* =====================================================
         MAIN MUSIC PLAYING
         → PAUSE MAIN MUSIC
      ===================================================== */

      if (
        playerReady &&
        player &&
        player.getPlayerState() ===
          YT.PlayerState.PLAYING
      ) {

        player.pauseVideo();

      }


      /* =====================================================
         HORN PLAYING
         → PAUSE HORN
      ===================================================== */

      if (
        hornPlayerReady &&
        hornPlayer &&
        hornPlayer.getPlayerState() ===
          YT.PlayerState.PLAYING
      ) {

        hornPlayer.pauseVideo();

      }


      /* =====================================================
         START BODI GALI
      ===================================================== */

      bodiGaliPlayer.seekTo(
        0,
        true
      );

      bodiGaliPlayer.playVideo();

    }
  );


</script>
  <script>
    /* =========================================================
   BUS SEAT SELECTOR
========================================================= */

const seatSelector =
  document.getElementById("seatSelector");

const seatDropdownBtn =
  document.getElementById("seatDropdownBtn");

const seatOptions =
  document.querySelectorAll(".seat-option");


    /* =========================================================
   BODI GALI BACKGROUND IMAGE
========================================================= */

const bodiGaliImage =
  "https://abhinav050799.github.io/autowalaPlaylistWebsite/image/bodiladai.jpg";

const saloonBg =
  document.querySelector(".saloon-bg");
    
/* =========================================================
   PRELOAD BODI GALI IMAGE
========================================================= */

const bodiGaliPreload =
  new Image();

bodiGaliPreload.src =
  bodiGaliImage;


/* =========================================================
   SMOOTH IMAGE CHANGE
========================================================= */

function changeToBodiGaliImage() {

  if (!saloonBg) return;

  /* Fade out */

  saloonBg.classList.add(
    "bodi-transition"
  );


  setTimeout(function () {

    saloonBg.style.backgroundImage =
      `url("${bodiGaliImage}")`;

    /* Fade in */

    requestAnimationFrame(function () {

      saloonBg.classList.remove(
        "bodi-transition"
      );

    });

  }, 350);

}


/* =========================================================
   BODI GALI BUTTON CLICK
========================================================= */

bodiGaliBtn.addEventListener(
  "click",
  function () {

    changeToBodiGaliImage();

  }
);
/* =========================================================
   SEAT IMAGES
========================================================= */

const seatImages = {

  front:
    "https://abhinav050799.github.io/autowalaPlaylistWebsite/image/fontseat.jpg",

  mid:
    "https://abhinav050799.github.io/autowalaPlaylistWebsite/image/midseat.jpg",

  last:
    "https://abhinav050799.github.io/autowalaPlaylistWebsite/image/lastseat.jpg"

};


/* =========================================================
   OPEN / CLOSE DROPDOWN
========================================================= */

seatDropdownBtn.addEventListener(
  "click",
  function (event) {

    event.stopPropagation();

    seatSelector.classList.toggle(
      "open"
    );

  }
);


/* =========================================================
   SELECT SEAT
========================================================= */

seatOptions.forEach(
  function (option) {

    option.addEventListener(
      "click",
      function (event) {

        event.stopPropagation();

        const seat =
          this.dataset.seat;

        changeBusSeat(
          seat
        );

        seatSelector.classList.remove(
          "open"
        );

      }
    );

  }
);


/* =========================================================
   CHANGE BUS SEAT
========================================================= */

function changeBusSeat(seat) {

  if (
    !seatImages[seat]
  ) {
    return;
  }


  /* =========================
     REMOVE OLD EFFECT
  ========================= */

  document.body.classList.remove(
    "seat-front",
    "seat-mid",
    "seat-last"
  );


  /* =========================
     CHANGE BACKGROUND
  ========================= */

  const bg =
    document.querySelector(
      ".saloon-bg"
    );

  if (bg) {

    bg.style.backgroundImage =
      `url("${seatImages[seat]}")`;

  }


  /* =========================
     ADD NEW EFFECT
  ========================= */

  if (seat === "front") {

    document.body.classList.add(
      "seat-front"
    );

  }

  else if (seat === "mid") {

    document.body.classList.add(
      "seat-mid"
    );

  }

  else if (seat === "last") {

    document.body.classList.add(
      "seat-last"
    );

  }


  /* =========================
     ACTIVE BUTTON
  ========================= */

  seatOptions.forEach(
    function (option) {

      option.classList.remove(
        "active"
      );

    }
  );


  const selectedOption =
    document.querySelector(
      `.seat-option[data-seat="${seat}"]`
    );

  if (selectedOption) {

    selectedOption.classList.add(
      "active"
    );

  }

}


/* =========================================================
   CLOSE DROPDOWN WHEN CLICKING OUTSIDE
========================================================= */

document.addEventListener(
  "click",
  function (event) {

    if (
      !seatSelector.contains(
        event.target
      )
    ) {

      seatSelector.classList.remove(
        "open"
      );

    }

  }
);

  </script>
