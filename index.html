<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Autowala · AutoVibes</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  >

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      background: #080808;
      overflow-x: hidden;
    }

    /* =========================
       BACKGROUND
    ========================= */

    .saloon-bg {
      position: fixed;
      inset: 0;
      z-index: -2;

      background-color: #090909;

      /*
        Apni image ka path yahan rakho.

        Agar HTML aur image same project folder mein hai:
        background-image: url("image/autoimg.jpg");

        Ye recommended hai.
      */

      background-image: url("image/autoimg.jpg");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .saloon-bg::after {
      content: "";
      /* position: absolute; */
      inset: 0;

      background: rgba(0, 0, 0, 0.68);

      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    /* =========================
       MAIN CARD
    ========================= */

    .saloon-card {
      position: relative;

      width: 100%;
      max-width: 780px;

      margin: 2rem 1.5rem;
      padding: 2rem 1.8rem 2.2rem;

      background: rgba(255, 255, 255, 0.045);

      backdrop-filter: blur(18px) saturate(180%);
      -webkit-backdrop-filter: blur(18px) saturate(180%);

      border: 1px solid rgba(255, 255, 255, 0.09);

      border-radius: 56px;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.7),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    /* =========================
       TOP BAR
    ========================= */

    .top-corner {
      position: absolute;

      top: 1.5rem;
      left: 1.8rem;
      right: 1.8rem;

      display: flex;
      justify-content: space-between;
      align-items: center;

      z-index: 5;
    }

    .online-badge {
      background: rgba(0, 0, 0, 0.35);

      backdrop-filter: blur(5px);

      border: 1px solid rgba(255, 255, 255, 0.07);

      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);

      padding: 0.4rem 1rem 0.4rem 0.9rem;

      border-radius: 100px;

      display: inline-flex;
      align-items: center;

      gap: 0.5rem;

      font-size: 0.85rem;
      font-weight: 500;

      color: rgba(255, 255, 255, 0.9);
    }

    .online-dot {
      width: 10px;
      height: 10px;

      background: #4ade80;

      border-radius: 50%;

      box-shadow: 0 0 10px #4ade80aa;

      animation: pulse-dot 2s infinite;
    }

    @keyframes pulse-dot {
      0% {
        opacity: 0.6;
        transform: scale(0.95);
      }

      50% {
        opacity: 1;
        transform: scale(1.15);
      }

      100% {
        opacity: 0.6;
        transform: scale(0.95);
      }
    }

    /* =========================
       LINKS
    ========================= */

    .pill-link {
      background: rgba(0, 0, 0, 0.3);

      backdrop-filter: blur(4px);

      border: 1px solid rgba(255, 255, 255, 0.07);

      border-radius: 100px;

      padding: 0.35rem 0.9rem 0.35rem 0.7rem;

      display: inline-flex;
      align-items: center;

      gap: 0.4rem;

      color: white;

      text-decoration: none;

      font-size: 0.8rem;
      font-weight: 500;

      transition: 0.2s;

      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .pill-link:hover {
      background: rgba(255, 255, 255, 0.08);
      color: white;
      transform: translateY(-1px);
    }

    .pill-link i {
      font-size: 1.1rem;
    }

    /* =========================
       LOGO
    ========================= */

    .logo {
      text-align: center;

      margin-top: 2.5rem;
      margin-bottom: 2rem;
    }

    .logo h1 {
      font-size: clamp(2rem, 7vw, 3.5rem);

      font-weight: 700;

      letter-spacing: 2px;

      color: white;

      text-shadow:
        0 5px 25px rgba(0, 0, 0, 0.8);
    }

    /* =========================
       YOUTUBE PLAYER
    ========================= */

    #youtube-player {
      position: absolute;

      width: 1px;
      height: 1px;

      left: -9999px;
      top: -9999px;

      opacity: 0;

      pointer-events: none;
    }

    /* =========================
       PLAYER
    ========================= */

    .player-glass {
      width: 100%;

      background: rgba(255, 255, 255, 0.055);

      backdrop-filter: blur(16px) saturate(160%);
      -webkit-backdrop-filter: blur(16px) saturate(160%);

      border: 1px solid rgba(255, 255, 255, 0.09);

      border-radius: 100px;

      padding: 0.55rem;

      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    /* =========================
       ALBUM
    ========================= */

    .album-wrapper {
      position: relative;

      width: 64px;
      height: 64px;

      flex-shrink: 0;

      cursor: pointer;
    }

    .album-art {
      width: 64px;
      height: 64px;

      border-radius: 50%;

      object-fit: cover;

      background: #222;

      border: 2px solid rgba(255, 255, 255, 0.08);

      box-shadow:
        0 4px 16px rgba(0, 0, 0, 0.6);

      animation: spin 12s linear infinite;

      animation-play-state: paused;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .play-pause-center {
      position: absolute;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      width: 26px;
      height: 26px;

      background: rgba(0, 0, 0, 0.75);

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid rgba(255, 255, 255, 0.2);

      pointer-events: none;
    }

    .play-pause-center i {
      font-size: 13px;
    }

    /* =========================
       TRACK INFO
    ========================= */

    .track-info {
      min-width: 150px;
    }

    .track-title {
      font-size: 0.95rem;
      font-weight: 600;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 0.75rem;

      color: rgba(255, 255, 255, 0.55);

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* =========================
       PROGRESS
    ========================= */

    .progress-row {
      display: flex;

      align-items: center;

      gap: 8px;

      margin-top: 6px;
    }

    .time-label {
      font-size: 0.68rem;

      color: rgba(255, 255, 255, 0.5);

      min-width: 30px;
    }

    .progress-custom {
      height: 5px;

      flex: 1;

      background: rgba(255, 255, 255, 0.15);

      border-radius: 10px;

      overflow: hidden;

      cursor: pointer;
    }

    .progress-fill {
      height: 100%;

      width: 0%;

      background: white;

      border-radius: 10px;

      transition: width 0.15s linear;
    }

    /* =========================
       BUTTONS
    ========================= */

    .ctrl-btn {
      width: 38px;
      height: 38px;

      border: none;

      border-radius: 50%;

      background: transparent;

      color: rgba(255, 255, 255, 0.75);

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 1.15rem;

      transition: 0.15s;

      cursor: pointer;
    }

    .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.09);

      color: white;
    }

    .ctrl-btn:active {
      transform: scale(0.9);
    }

    .play-btn {
      width: 46px;
      height: 46px;

      background: white;

      color: #080808;

      font-size: 1.4rem;

      box-shadow:
        0 4px 18px rgba(0, 0, 0, 0.5);
    }

    .play-btn:hover {
      background: #f0f0f0;

      color: #000;

      transform: scale(1.04);
    }

    /* =========================
       STATUS
    ========================= */

    .player-status {
      text-align: center;

      margin-top: 12px;

      font-size: 0.68rem;

      color: rgba(255, 255, 255, 0.45);
    }

    .status-dot {
      display: inline-block;

      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #facc15;

      margin-right: 5px;
    }

    .status-dot.playing {
      background: #4ade80;

      box-shadow: 0 0 8px #4ade80;
    }

    /* =========================
       FOOTER
    ========================= */

    .footer-text {
      text-align: center;

      margin-top: 16px;

      font-size: 0.68rem;

      opacity: 0.3;

      letter-spacing: 0.05em;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      body {
        align-items: center;
      }

      .saloon-card {
        margin: 0.8rem;

        padding: 1.2rem 0.8rem 1.5rem;

        border-radius: 30px;
      }

      .top-corner {
        position: relative;

        top: auto;
        left: auto;
        right: auto;

        margin-bottom: 10px;

        justify-content: center;

        gap: 8px;

        flex-wrap: wrap;
      }

      .logo {
        margin-top: 0.8rem;
        margin-bottom: 1.5rem;
      }

      .player-glass {
        border-radius: 30px;

        padding: 10px;

        flex-wrap: wrap;

        justify-content: center;
      }

      .track-info {
        width: calc(100% - 80px);

        min-width: 0;
      }

      .player-controls {
        width: 100%;

        justify-content: center;

        margin-top: 5px;
      }

      .album-wrapper,
      .album-art {
        width: 58px;
        height: 58px;
      }

      .online-badge {
        font-size: 0.72rem;
      }
    }
  </style>
</head>

<body>

  <!-- BACKGROUND -->
  <div class="saloon-bg"></div>

  <!-- MAIN CARD -->
  <div class="saloon-card">

    <!-- TOP -->
    <div class="top-corner">

      <div class="online-badge">
        <span class="online-dot"></span>
        <span>30</span>
        <span style="opacity:0.6;">
          online
        </span>
      </div>

      <div class="d-flex gap-2">

        <a
          href="https://open.spotify.com/"
          target="_blank"
          rel="noopener"
          class="pill-link"
        >
          <i class="bi bi-spotify"></i>
          <span class="d-none d-sm-inline">Spotify</span>
          <i class="bi bi-box-arrow-up-right"></i>
        </a>

        <a
          href="https://music.youtube.com/"
          target="_blank"
          rel="noopener"
          class="pill-link"
        >
          <i class="bi bi-youtube"></i>
          <span class="d-none d-sm-inline">YT Music</span>
          <i class="bi bi-box-arrow-up-right"></i>
        </a>

      </div>
    </div>


    <!-- LOGO -->
    <div class="logo">
      <h1>
         <img
  src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 500 120'%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-family='Georgia, serif' font-weight='700' font-size='48' fill='%23ffffff' letter-spacing='3'%3Eदिलक्स सलून%3C/text%3E%3C/svg%3E"
  alt="दिलक्स सलून"
  class="logo-svg"
  style="color:transparent;"
>


      </h1>
    </div>


    <!-- HIDDEN YOUTUBE -->
    <div id="youtube-player"></div>


    <!-- PLAYER -->
    <div class="player-glass d-flex align-items-center gap-3">

      <!-- ALBUM -->
      <div
        class="album-wrapper"
        id="albumWrapper"
        title="Play / Pause"
      >

        <img
          id="albumArt"
          class="album-art"
          src="https://i.ytimg.com/vi/oq5Ocx_rEv8/hqdefault.jpg"
          alt="Album Art"
        >

          <i
            id="overlayIcon"
            class="bi bi-play-fill"
          ></i>
        </div>

      </div>


      <!-- TRACK INFO -->
      <div class="track-info flex-grow-1">

        <div
          id="trackTitle"
          class="track-title"
        >
          Kal Ho Naa Ho
        </div>

        <div
          id="trackArtist"
          class="track-artist"
        >
          Sonu Nigam
        </div>


        <!-- PROGRESS -->
        <div class="progress-row">

          <span
            id="currentTime"
            class="time-label"
          >
            0:00
          </span>

          <div
            id="progressContainer"
            class="progress-custom"
          >
            <div
              id="progressFill"
              class="progress-fill"
            ></div>
          </div>

          <span
            id="durationTime"
            class="time-label"
          >
            0:00
          </span>

        </div>

      </div>


      <!-- CONTROLS -->
      <div class="player-controls d-flex align-items-center gap-1">

        <button
          id="prevBtn"
          class="ctrl-btn"
          type="button"
          aria-label="Previous Song"
          title="Previous"
        >
          <i class="bi bi-skip-backward-fill"></i>
        </button>


        <button
          id="playBtn"
          class="ctrl-btn play-btn"
          type="button"
          aria-label="Play"
          title="Play"
        >
          <i
            id="playIcon"
            class="bi bi-play-fill"
          ></i>
        </button>


        <button
          id="nextBtn"
          class="ctrl-btn"
          type="button"
          aria-label="Next Song"
          title="Next"
        >
          <i class="bi bi-skip-forward-fill"></i>
        </button>

      </div>

    </div>


    <!-- STATUS -->
    <div class="player-status">

      <span
        id="statusDot"
        class="status-dot"
      ></span>

      <span id="statusText">
        Press Play to start music
      </span>

    </div>


    <!-- FOOTER -->
    <div class="footer-text">
      ⚡ 90s Bollywood bangers · auto-play playlist
    </div>

  </div>


  <!-- =========================
       YOUTUBE IFRAME API
  ========================= -->

  <script src="https://www.youtube.com/iframe_api"></script>


  <script>
    /*
    ============================================================
      AUTOVIBES MUSIC PLAYER
    ============================================================
    */


    /* =========================
       PLAYLIST

       IMPORTANT:
       YouTube video ID yahan se aata hai:

       https://www.youtube.com/watch?v=VIDEO_ID

       Example:
       https://www.youtube.com/watch?v=oq5Ocx_rEv8

       ID = oq5Ocx_rEv8
    ========================= */

    const playlist = [

      {
        id: "oq5Ocx_rEv8",
        title: "Kal Ho Naa Ho",
        artist: "Sonu Nigam",
        cover: "https://i.ytimg.com/vi/oq5Ocx_rEv8/hqdefault.jpg"
      },

      {
        id: "39BOqZO8xaM",
        title: "Tera Ban Jaunga",
        artist: "Akhil Sachdeva",
        cover: "https://i.ytimg.com/vi/39BOqZO8xaM/hqdefault.jpg"
      },

      {
        id: "xZw3g5B0x_U",
        title: "Tum Hi Ho",
        artist: "Arijit Singh",
        cover: "https://i.ytimg.com/vi/xZw3g5B0x_U/hqdefault.jpg"
      },

      {
        id: "y8uXhLjl9Kk",
        title: "Mujhse Mohabbat Ka Izhaar",
        artist: "Satrang Music Official",
        cover: "https://i.ytimg.com/vi/y8uXhLjl9Kk/hqdefault.jpg"
      }

    ];


    /* =========================
       VARIABLES
    ========================= */

    let player = null;

    let playerReady = false;

    let currentIndex = 0;

    let isPlaying = false;

    let userStarted = false;

    let progressTimer = null;


    /* =========================
       DOM
    ========================= */

    const playBtn =
      document.getElementById("playBtn");

    const playIcon =
      document.getElementById("playIcon");

    const overlayIcon =
      document.getElementById("overlayIcon");

    const albumArt =
      document.getElementById("albumArt");

    const albumWrapper =
      document.getElementById("albumWrapper");

    const trackTitle =
      document.getElementById("trackTitle");

    const trackArtist =
      document.getElementById("trackArtist");

    const currentTime =
      document.getElementById("currentTime");

    const durationTime =
      document.getElementById("durationTime");

    const progressFill =
      document.getElementById("progressFill");

    const progressContainer =
      document.getElementById("progressContainer");

    const statusText =
      document.getElementById("statusText");

    const statusDot =
      document.getElementById("statusDot");


    /* =========================
       FORMAT TIME
    ========================= */

    function formatTime(seconds) {

      if (
        !seconds ||
        isNaN(seconds) ||
        seconds < 0
      ) {
        return "0:00";
      }

      const mins =
        Math.floor(seconds / 60);

      const secs =
        Math.floor(seconds % 60);

      return (
        mins +
        ":" +
        String(secs).padStart(2, "0")
      );
    }


    /* =========================
       UPDATE UI
    ========================= */

    function updatePlayButton(playing) {

      isPlaying = playing;

      if (playing) {

        playIcon.className =
          "bi bi-pause-fill";

        overlayIcon.className =
          "bi bi-pause-fill";

        albumArt.style.animationPlayState =
          "running";

        statusDot.classList.add(
          "playing"
        );

        statusText.textContent =
          "Now playing";

      } else {

        playIcon.className =
          "bi bi-play-fill";

        overlayIcon.className =
          "bi bi-play-fill";

        albumArt.style.animationPlayState =
          "paused";

        statusDot.classList.remove(
          "playing"
        );

        statusText.textContent =
          "Paused";
      }
    }


    /* =========================
       LOAD TRACK UI
    ========================= */

    function updateTrackUI(index) {

      const song =
        playlist[index];

      if (!song) return;

      trackTitle.textContent =
        song.title;

      trackArtist.textContent =
        song.artist;

      albumArt.src =
        song.cover;

      currentTime.textContent =
        "0:00";

      durationTime.textContent =
        "0:00";

      progressFill.style.width =
        "0%";
    }


    /* =========================
       LOAD SONG
    ========================= */

    function loadTrack(
      index,
      autoPlay = false
    ) {

      if (!playerReady || !player) {
        return;
      }

      if (
        index < 0 ||
        index >= playlist.length
      ) {
        return;
      }

      currentIndex = index;

      const song =
        playlist[currentIndex];

      updateTrackUI(currentIndex);

      statusText.textContent =
        "Loading " + song.title + "...";

      /*
        cueVideoById = video load karega
        lekin automatically play nahi karega.
      */

      if (autoPlay) {

        player.loadVideoById({
          videoId: song.id,
          startSeconds: 0
        });

      } else {

        player.cueVideoById({
          videoId: song.id,
          startSeconds: 0
        });

      }
    }


    /* =========================
       PLAY
    ========================= */

    function playMusic() {

      if (!playerReady || !player) {

        statusText.textContent =
          "YouTube player loading...";

        return;
      }

      userStarted = true;

      /*
        Browser autoplay policy:
        Play button click is user interaction,
        therefore audio can start.
      */

      player.playVideo();

      statusText.textContent =
        "Starting music...";
    }


    /* =========================
       PAUSE
    ========================= */

    function pauseMusic() {

      if (!playerReady || !player) {
        return;
      }

      player.pauseVideo();
    }


    /* =========================
       TOGGLE
    ========================= */

    function togglePlay() {

      if (!playerReady) {

        statusText.textContent =
          "YouTube player loading...";

        return;
      }

      if (isPlaying) {

        pauseMusic();

      } else {

        playMusic();

      }
    }


    /* =========================
       NEXT TRACK
    ========================= */

    function nextTrack() {

      currentIndex =
        (currentIndex + 1) %
        playlist.length;

      updateTrackUI(currentIndex);

      const song =
        playlist[currentIndex];

      statusText.textContent =
        "Loading next song...";

      /*
        Next button is a user interaction,
        so autoplay works after clicking.
      */

      player.loadVideoById({
        videoId: song.id,
        startSeconds: 0
      });

      userStarted = true;
    }


    /* =========================
       PREVIOUS TRACK
    ========================= */

    function prevTrack() {

      currentIndex =
        (
          currentIndex -
          1 +
          playlist.length
        ) %
        playlist.length;

      updateTrackUI(currentIndex);

      const song =
        playlist[currentIndex];

      statusText.textContent =
        "Loading previous song...";

      player.loadVideoById({
        videoId: song.id,
        startSeconds: 0
      });

      userStarted = true;
    }


    /* =========================
       YOUTUBE API READY
    ========================= */

    window.onYouTubeIframeAPIReady =
      function () {

        console.log(
          "YouTube API Ready"
        );

        player =
          new YT.Player(
            "youtube-player",
            {

              width: "1",

              height: "1",

              videoId:
                playlist[0].id,

              playerVars: {

                /*
                  Start muted because browser
                  autoplay is normally blocked
                  when audio is enabled.
                */
                autoplay: 0,

                controls: 0,

                rel: 0,

                playsinline: 1,

                modestbranding: 1,

                iv_load_policy: 3

              },

              events: {

                onReady:
                  onPlayerReady,

                onStateChange:
                  onPlayerStateChange,

                onError:
                  onPlayerError

              }

            }
          );
      };


    /* =========================
       PLAYER READY
    ========================= */

    function onPlayerReady(event) {

      console.log(
        "YouTube Player Ready"
      );

      playerReady = true;

      updateTrackUI(
        currentIndex
      );

      statusText.textContent =
        "Press Play to start music";

      /*
        Progress updater
      */

      progressTimer =
        setInterval(
          updateProgress,
          500
        );
    }


    /* =========================
       PLAYER STATE
    ========================= */

    function onPlayerStateChange(event) {

      const state =
        event.data;


      console.log(
        "YouTube state:",
        state
      );


      /* PLAYING */

      if (
        state ===
        YT.PlayerState.PLAYING
      ) {

        updatePlayButton(true);

      }


      /* PAUSED */

      else if (
        state ===
        YT.PlayerState.PAUSED
      ) {

        updatePlayButton(false);

      }


      /* BUFFERING */

      else if (
        state ===
        YT.PlayerState.BUFFERING
      ) {

        statusText.textContent =
          "Buffering...";

      }


      /* ENDED */

      else if (
        state ===
        YT.PlayerState.ENDED
      ) {

        updatePlayButton(false);

        /*
          Song khatam hote hi
          automatically next song.
        */

        setTimeout(
          function () {

            nextTrack();

          },
          300
        );
      }
    }


    /* =========================
       YOUTUBE ERROR
    ========================= */

    function onPlayerError(event) {

      console.error(
        "YouTube Error:",
        event.data
      );

      statusText.textContent =
        "This track cannot play. Trying next...";

      /*
        Agar video deleted / restricted /
        unavailable hai to next song.
      */

      setTimeout(
        function () {

          nextTrack();

        },
        1000
      );
    }


    /* =========================
       PROGRESS
    ========================= */

    function updateProgress() {

      if (
        !playerReady ||
        !player
      ) {
        return;
      }

      try {

        const current =
          player.getCurrentTime();

        const duration =
          player.getDuration();

        if (
          duration &&
          duration > 0
        ) {

          const percent =
            (
              current /
              duration
            ) * 100;

          progressFill.style.width =
            Math.min(
              100,
              percent
            ) + "%";

          currentTime.textContent =
            formatTime(current);

          durationTime.textContent =
            formatTime(duration);
        }

      } catch (error) {

        console.log(
          "Progress error",
          error
        );

      }
    }


    /* =========================
       SEEK
    ========================= */

    progressContainer.addEventListener(
      "click",
      function (event) {

        if (
          !playerReady ||
          !player
        ) {
          return;
        }

        const rect =
          this.getBoundingClientRect();

        const clickX =
          event.clientX -
          rect.left;

        const percentage =
          Math.max(
            0,
            Math.min(
              1,
              clickX /
              rect.width
            )
          );

        const duration =
          player.getDuration();

        if (
          duration &&
          duration > 0
        ) {

          player.seekTo(
            percentage * duration,
            true
          );
        }
      }
    );


    /* =========================
       BUTTON EVENTS
    ========================= */

    playBtn.addEventListener(
      "click",
      function () {

        togglePlay();

      }
    );


    albumWrapper.addEventListener(
      "click",
      function () {

        togglePlay();

      }
    );


    document
      .getElementById("nextBtn")
      .addEventListener(
        "click",
        function () {

          if (playerReady) {
            nextTrack();
          }

        }
      );


    document
      .getElementById("prevBtn")
      .addEventListener(
        "click",
        function () {

          if (playerReady) {
            prevTrack();
          }

        }
      );


    /* =========================
       KEYBOARD
    ========================= */

    document.addEventListener(
      "keydown",
      function (event) {

        /*
          Space = Play/Pause
        */

        if (
          event.code ===
          "Space"
        ) {

          event.preventDefault();

          togglePlay();

        }


        /*
          Right Arrow = Next
        */

        else if (
          event.code ===
          "ArrowRight"
        ) {

          event.preventDefault();

          if (playerReady) {
            nextTrack();
          }

        }


        /*
          Left Arrow = Previous
        */

        else if (
          event.code ===
          "ArrowLeft"
        ) {

          event.preventDefault();

          if (playerReady) {
            prevTrack();
          }

        }

      }
    );


    /* =========================
       CLEANUP
    ========================= */

    window.addEventListener(
      "beforeunload",
      function () {

        if (progressTimer) {

          clearInterval(
            progressTimer
          );

        }

      }
    );

  </script>


  <!-- Bootstrap JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
  ></script>

</body>
